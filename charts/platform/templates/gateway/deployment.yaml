{{- if .Values.gateway.enabled }}
{{- $ctx := dict "ctx" $ "component" "gateway" }}
{{- $v := .Values.gateway }}
# The stable gateway. The canary (#23, canary-deployment.yaml) runs the same pod template under its
# own component label, so this Deployment's (immutable) selector never matches canary pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.componentName" $ctx }}
  labels:
    {{- include "platform.labels" $ctx | nindent 4 }}
    track: stable
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" $ctx | nindent 6 }}
  template:
    {{- include "platform.gatewayPodTemplate" (dict
      "ctx" $
      "component" "gateway"
      "track" "stable"
      "image" (printf "%s:%s" $v.image.repository ($v.image.tag | default .Chart.AppVersion))
      "pullPolicy" $v.image.pullPolicy
      "fault" nil) | nindent 4 }}
{{- end }}
