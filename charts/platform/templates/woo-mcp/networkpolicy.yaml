{{- if and .Values.wooMcp.enabled .Values.wooMcp.networkPolicy.enabled }}
{{- $ctx := dict "ctx" $ "component" "woo-mcp" }}
# Only this release's gateway pods may open connections to woo-mcp (K5): it holds the store's
# Application Password, so nothing else in the cluster may call its tools directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.componentName" $ctx }}
  labels:
    {{- include "platform.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Same namespace only (a bare podSelector never matches other namespaces).
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
