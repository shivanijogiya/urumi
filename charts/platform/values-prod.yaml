# VPS / production. Replace the placeholder host before installing.
# The Secret `secretName` must already exist in the namespace (created out-of-band; see values.yaml).
#   helm upgrade --install urumi charts/platform -n urumi -f charts/platform/values-prod.yaml --wait

secretName: urumi-env

ingress:
  className: traefik

store:
  host: store.example.com
  url: ''
  # Enable once a certificate exists for the host (e.g. cert-manager issuing into secretName);
  # store.url then defaults to https://<host>.
  tls:
    enabled: false
    secretName: store-tls

mariadb:
  persistence:
    size: 5Gi
    # Empty = the cluster's default StorageClass.
    storageClass: ''

wordpress:
  persistence:
    size: 5Gi
    storageClass: ''

bootstrap:
  enabled: true
  # Served over HTTPS; see values.yaml for in-cluster HTTP calls (X-Forwarded-Proto).
  environmentType: production
  storeTitle: Urumi Store
  # The Job downloads WooCommerce from wordpress.org: the cluster needs egress to it.

postgres:
  persistence:
    size: 5Gi
    storageClass: ''

gateway:
  image:
    # Replace with the project's GitLab container registry path and a released tag.
    repository: registry.gitlab.com/<group>/<project>/gateway
    tag: ''
    pullPolicy: IfNotPresent
